name: Build DockSide.app

on:
  push:
    branches: [main, dev]   # dev 只编译检查，不发版本
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app (universal)
        run: |
          set -o pipefail
          UNIVERSAL=1 bash build.sh 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E "error:|warning: .*will be an error" build.log | head -60; echo; tail -40 build.log; echo '```'; } > report.md
          gh issue create --title "构建失败 #${{ github.run_number }}" --body-file report.md

      - name: Zip app
        if: github.ref == 'refs/heads/main'
        run: cd build && ditto -c -k --keepParent DockSide.app DockSide.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" build/DockSide.zip \
            --title "DockSide $TAG" \
            --notes "解压后把 DockSide.app 拖进「应用程序」。首次打开若被拦截，在终端运行 xattr -cr /Applications/DockSide.app。然后在「系统设置 › 隐私与安全性 › 辅助功能」允许 DockSide。" \
            --latest
